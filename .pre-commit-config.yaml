repos:
  # Full quality gate before pushing
  - repo: local
    hooks:
      - id: full-check-pre-push
        name: full-check-pre-push
        entry: python -c "import subprocess, os; cmd = 'powershell' if os.name == 'nt' else 'pwsh'; subprocess.run([cmd, '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './tasks.ps1', 'check'], check=True)"
        language: system
        pass_filenames: false
        stages: [pre-push]

  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Pre-commit hooks for basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: []
        files: ^src/

# Configuration
default_language_version:
  python: python3.11

# Global settings
fail_fast: false
